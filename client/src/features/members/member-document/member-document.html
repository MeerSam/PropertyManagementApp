<div class="flex flex-col w-full">
  <div class="flex justify-between items-center">
    <div class="tabs tabs-lift tabs-lg text-primary w-fit mx-3" role="tablist">
      @for (tab of tabs; track $index) {
        <button role="tab" class="tab" (click)="setScope(tab.value )"
          [class.tab-active]="scope() === tab.value">{{tab.label}}</button>
        }
    </div>
  </div>
</div>
