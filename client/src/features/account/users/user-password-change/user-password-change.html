<div class="card bg-base-100  mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Change Password</div>
    @if(session.currentUser()?.id == user()?.id || session.isAdminRole()){
        <div class="card-body w-full">
            <form [formGroup]="credentialsForm" (click)="changeCredentials()" class="flex flex-col gap-4 w-full">

                <app-text-input class="m-2" type="password" label="Current Password" formControlName="currentPassword" />
                <app-text-input class="m-2" type="password" label="New Password" formControlName="newPassword" />
                <app-text-input class="m-2" type="password" label="New Confirm Password" formControlName="confirmPassword" />

                <div class="flex items-center justify-end gap-3">
                    <button class="btn" type="button" (click)="cancel()">Cancel</button>
                    <button [disabled]="!credentialsForm.valid" class="btn btn-primary" type="submit">Change Password</button>
                </div>
            </form>
        </div>
    }
    </div>
