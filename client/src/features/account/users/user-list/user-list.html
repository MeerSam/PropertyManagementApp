@if (['admin', 'support'].includes(session.currentRole() ?? '')) {
    @if (users(); as users) {
        <div class="flex flex-col w-full">
            <div class="grid grid-cols-4 gap-6">
                @for (user of users; track user.id) {        
                    @if(user){        
                        <div routerLink ="/users/{{user.id}}" class="card cursor-pointer transition-all duration-300 ease-in-out 
                                    transform hover:-translate-y-2 relative">
                            <div class="card bg-base-100 w-90 shadow-sm gap-2">
                                <figure>
                                    <img src="{{user.imageUrl || '/user.png'}}" alt="{{user.firstName}} image"
                                        class="size-1/2 object-cover rounded-box" />
                                </figure>
                                <div class="card-body">
                                    <h2 class="card-title">
                                        {{user.firstName + ' ' + user.lastName}}
                                        <div class="badge badge-secondary">{{user.role}}</div>
                                    </h2> 
                                </div>
                            </div>
                        </div>
                    }
                }
            </div>
        </div>
    }
} @else {
    <div>
        <span class="font-semibold">No Users</span>
    </div>
}
